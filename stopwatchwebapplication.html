<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>CHRONO_LABS | Kinetic Precision</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#adaaaa",
                        "error-container": "#b92902",
                        "on-primary-fixed": "#3a4a00",
                        "tertiary-fixed": "#fce047",
                        "on-tertiary-fixed-variant": "#685900",
                        "background": "#0e0e0e",
                        "inverse-surface": "#fcf8f8",
                        "on-background": "#ffffff",
                        "secondary-container": "#006875",
                        "secondary-dim": "#00d4ec",
                        "on-surface": "#ffffff",
                        "secondary": "#00e3fd",
                        "tertiary-container": "#fce047",
                        "on-tertiary": "#665800",
                        "surface-bright": "#2c2c2c",
                        "outline": "#777575",
                        "on-primary-container": "#4a5e00",
                        "on-secondary": "#004d57",
                        "on-secondary-container": "#e8fbff",
                        "on-secondary-fixed-variant": "#005964",
                        "on-primary-fixed-variant": "#526900",
                        "surface": "#0e0e0e",
                        "on-primary": "#516700",
                        "secondary-fixed": "#26e6ff",
                        "inverse-primary": "#516700",
                        "tertiary": "#ffeea5",
                        "surface-container-lowest": "#000000",
                        "error-dim": "#d53d18",
                        "primary": "#f3ffca",
                        "surface-container-high": "#201f1f",
                        "surface-container-highest": "#262626",
                        "tertiary-dim": "#edd13a",
                        "primary-dim": "#beee00",
                        "on-secondary-fixed": "#003a42",
                        "surface-dim": "#0e0e0e",
                        "primary-fixed": "#cafd00",
                        "on-error-container": "#ffd2c8",
                        "on-error": "#450900",
                        "surface-tint": "#f3ffca",
                        "surface-container-low": "#131313",
                        "on-tertiary-fixed": "#483d00",
                        "on-tertiary-container": "#5d5000",
                        "inverse-on-surface": "#565554",
                        "error": "#ff7351",
                        "outline-variant": "#494847",
                        "primary-fixed-dim": "#beee00",
                        "surface-variant": "#262626",
                        "primary-container": "#cafd00",
                        "surface-container": "#1a1919",
                        "tertiary-fixed-dim": "#edd13a",
                        "secondary-fixed-dim": "#00d7f0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }

        body {
            background-color: #0e0e0e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col overflow-x-hidden">
    <!-- TopAppBar -->
    <header
        class="flex justify-between items-center w-full px-6 py-4 max-w-full mx-auto bg-[#131313] docked full-width top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-[#f3ffca]" data-icon="speed">speed</span>
            <h1 class="text-xl font-bold tracking-[0.2em] text-[#f3ffca] font-['Space_Grotesk'] uppercase">CHRONO_LABS
            </h1>
        </div>
        <div class="flex gap-4">
            <button class="text-[#adaaaa] hover:text-[#00e3fd] transition-colors duration-300 active:scale-95">
                <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
            </button>
        </div>
    </header>
    <!-- Main Canvas -->
    <main class="flex-1 flex flex-col pt-12 px-6 pb-32">
        <!-- Hero Chrono Display -->
        <section class="flex flex-col items-center justify-center mb-16 relative">
            <!-- Ghost Dial Background -->
            <div
                class="absolute w-72 h-72 border border-outline-variant opacity-10 rounded-full flex items-center justify-center">
                <div class="w-64 h-64 border border-outline-variant opacity-20 rounded-full"></div>
            </div>
            <div class="text-center z-10">
                <span
                    class="font-label text-on-surface-variant text-[0.6875rem] uppercase tracking-widest block mb-4">CURRENT
                    ELAPSED TIME</span>
                <div
                    class="font-headline font-bold text-[4.5rem] leading-none tracking-tighter text-primary tabular-nums">
                    04:21<span class="text-primary-dim opacity-60 text-4xl">.84</span>
                </div>
                <div class="mt-4 flex items-center justify-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-secondary shadow-[0_0_10px_rgba(0,227,253,0.5)]"></div>
                    <span class="font-label text-secondary text-[0.6875rem] uppercase tracking-[0.2em]">Session
                        Active</span>
                </div>
            </div>
        </section>
        <!-- Kinetic Actuators (Buttons) -->
        <section class="flex justify-between items-center max-w-sm mx-auto w-full gap-4 mb-12">
            <!-- Reset Button -->
            <button class="flex flex-col items-center gap-2 group">
                <div
                    class="w-16 h-16 rounded-full border border-outline-variant flex items-center justify-center text-on-surface-variant group-hover:text-error transition-all active:scale-90">
                    <span class="material-symbols-outlined" data-icon="replay">replay</span>
                </div>
                <span class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest">Reset</span>
            </button>
            <!-- Main Start/Stop Actuator -->
            <button
                class="w-24 h-24 rounded-full bg-gradient-to-b from-primary to-primary-container flex items-center justify-center shadow-[0_10px_40px_rgba(243,255,202,0.15)] active:scale-95 transition-transform duration-150">
                <span class="material-symbols-outlined text-on-primary text-4xl" data-icon="pause"
                    style="font-variation-settings: 'FILL' 1;">pause</span>
            </button>
            <!-- Lap Button -->
            <button class="flex flex-col items-center gap-2 group">
                <div
                    class="w-16 h-16 rounded-full border border-secondary/30 flex items-center justify-center text-secondary group-hover:bg-secondary/10 transition-all active:scale-90">
                    <span class="material-symbols-outlined" data-icon="timer">timer</span>
                </div>
                <span class="font-label text-[10px] text-secondary uppercase tracking-widest">Lap</span>
            </button>
        </section>
        <!-- Lap History List -->
        <section class="flex-1">
            <div class="flex justify-between items-center mb-6 px-2">
                <h2 class="font-headline text-lg font-bold tracking-tight text-on-surface uppercase">Lap Splits</h2>
                <span class="text-on-surface-variant font-label text-[10px] uppercase tracking-widest">Total: 4
                    Laps</span>
            </div>
            <div class="space-y-3">
                <!-- Lap Item 1 (Newest) -->
                <div
                    class="bg-surface-container-high p-5 rounded-xl flex justify-between items-center border-l-4 border-secondary">
                    <div class="flex flex-col">
                        <span class="font-label text-on-surface-variant text-[0.6875rem] uppercase tracking-widest">Lap
                            04</span>
                        <span class="font-headline text-xl text-on-surface tracking-tight tabular-nums">01:04.12</span>
                    </div>
                    <div class="text-right">
                        <span
                            class="font-label text-secondary text-[0.6875rem] uppercase tracking-widest block mb-1">Delta</span>
                        <span class="font-headline text-sm text-secondary font-medium">+0.12s</span>
                    </div>
                </div>
                <!-- Lap Item 2 -->
                <div class="bg-surface-container-low p-5 rounded-xl flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="font-label text-on-surface-variant text-[0.6875rem] uppercase tracking-widest">Lap
                            03</span>
                        <span class="font-headline text-xl text-on-surface tracking-tight tabular-nums">01:04.00</span>
                    </div>
                    <div class="text-right">
                        <span
                            class="font-label text-on-surface-variant text-[0.6875rem] uppercase tracking-widest block mb-1">Split</span>
                        <span class="font-headline text-sm text-on-surface-variant font-medium">03:17.72</span>
                    </div>
                </div>
                <!-- Lap Item 3 (Fastest) -->
                <div
                    class="bg-surface-container-low p-5 rounded-xl flex justify-between items-center border border-primary/20 bg-primary/5">
                    <div class="flex flex-col">
                        <span
                            class="font-label text-primary text-[0.6875rem] uppercase tracking-widest flex items-center gap-1">
                            <span class="material-symbols-outlined text-xs" data-icon="bolt"
                                style="font-variation-settings: 'FILL' 1;">bolt</span>
                            Lap 02
                        </span>
                        <span class="font-headline text-xl text-on-surface tracking-tight tabular-nums">01:02.45</span>
                    </div>
                    <div class="text-right">
                        <span
                            class="font-label text-primary text-[0.6875rem] uppercase tracking-widest block mb-1">Personal
                            Best</span>
                        <span class="font-headline text-sm text-primary font-medium">FASTEST</span>
                    </div>
                </div>
                <!-- Lap Item 4 -->
                <div class="bg-surface-container-low p-5 rounded-xl flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="font-label text-on-surface-variant text-[0.6875rem] uppercase tracking-widest">Lap
                            01</span>
                        <span class="font-headline text-xl text-on-surface tracking-tight tabular-nums">01:11.15</span>
                    </div>
                    <div class="text-right">
                        <span
                            class="font-label text-on-surface-variant text-[0.6875rem] uppercase tracking-widest block mb-1">Split</span>
                        <span class="font-headline text-sm text-on-surface-variant font-medium">01:11.15</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <!-- BottomNavBar -->
    <nav
        class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-8 pt-4 bg-[#0e0e0e]/80 backdrop-blur-xl shadow-[0_-10px_40px_rgba(243,255,202,0.06)]">
        <!-- Timer Tab (Active) -->
        <a class="flex flex-col items-center justify-center bg-gradient-to-b from-[#f3ffca] to-[#cafd00] text-[#0e0e0e] rounded-full w-12 h-12 active:scale-90 duration-150"
            href="#">
            <span class="material-symbols-outlined" data-icon="timer"
                style="font-variation-settings: 'FILL' 1;">timer</span>
        </a>
        <!-- History Tab -->
        <a class="flex flex-col items-center justify-center text-[#adaaaa] w-12 h-12 hover:text-[#f3ffca] transition-all active:scale-90 duration-150"
            href="#">
            <span class="material-symbols-outlined" data-icon="history">history</span>
        </a>
        <!-- Settings Tab -->
        <a class="flex flex-col items-center justify-center text-[#adaaaa] w-12 h-12 hover:text-[#f3ffca] transition-all active:scale-90 duration-150"
            href="#">
            <span class="material-symbols-outlined" data-icon="settings">settings</span>
        </a>
    </nav>
</body>

</html>
